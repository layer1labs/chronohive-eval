# Local ChronoHive eval deployment. Stdlib-only image; no build args.
services:
  api:
    build:
      context: .
      dockerfile: service/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - eval-secrets:/run/secrets
      - eval-logs:/var/log/chronohive
      - eval-state:/var/lib/chronohive
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/v1/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped

volumes:
  eval-secrets:
  eval-logs:
  eval-state:
